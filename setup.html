<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TernKonnect - Microphone Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(165deg, #10111a 0%, #171922 100%);
      color: #eff0f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .ambient {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      top: -100px;
      right: -100px;
      pointer-events: none;
    }
    .ambient.b {
      bottom: -150px;
      left: -150px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
      top: auto;
      right: auto;
    }
    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 40px 30px;
      width: 450px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .logo-ring {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #6366f1; /* Primary color */
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #8b8db0;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      padding: 12px 30px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(135deg, hsl(239 84% 67%), hsl(263 70% 58%));
      color: white;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
      transition: all 0.25s ease;
    }
    .btn:hover {
      box-shadow: 0 6px 20px rgba(99,102,241,0.5);
      transform: translateY(-2px);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 16px;
      border-radius: 20px;
      font-weight: 500;
      margin-top: 15px;
    }
    .status-badge.yellow { background: rgba(250,204,21,0.1); color: #facc15; }
    .status-badge.red { background: rgba(239,68,68,0.1); color: #f87171; }
    .status-badge.green { background: rgba(16,185,129,0.1); color: #34d399; }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="ambient b"></div>

  <div class="card">
    <div class="logo-ring">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </div>
    <h1>Enable Microphone Access</h1>
    <p id="instruction">TernKonnect needs permission to use your microphone so it can listen to your voice commands. Please click "Allow" on the permission prompt at the top of your screen.</p>
    <button class="btn" id="startBtn">Setup Microphone</button>
    <div id="status" class="status-badge yellow">Waiting for user gesture...</div>
  </div>

  <script src="setup.js"></script>
</body>
</html>

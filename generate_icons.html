<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Generate TernKonnect Icons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      padding: 40px;
      background: #0f1016;
      color: #eff0f3;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 35px;
      width: 400px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }
    h2 {
      color: #6366f1;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    p {
      color: #8b8db0;
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 500;
      margin-top: 10px;
    }
    .status-badge.yellow { background: rgba(250,204,21,0.1); color: #facc15; }
    .status-badge.green { background: rgba(16,185,129,0.1); color: #34d399; }
    .status-badge.red { background: rgba(239,68,68,0.1); color: #f87171; }
    .preview-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
      align-items: flex-end;
    }
    .preview-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .preview-label {
      font-size: 10px;
      color: #5b5d80;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>TernKonnect Icon Generator</h2>
    <p>Generating the brand logo icons using TernKonnect colors and automatically saving them to the extension folder...</p>
    
    <div id="status" class="status-badge yellow">Initializing generation…</div>
    
    <div class="preview-container">
      <div class="preview-box">
        <canvas id="c128" style="width: 64px; height: 64px; border-radius: 8px;"></canvas>
        <span class="preview-label">128x128</span>
      </div>
      <div class="preview-box">
        <canvas id="c48" style="width: 32px; height: 32px; border-radius: 6px;"></canvas>
        <span class="preview-label">48x48</span>
      </div>
      <div class="preview-box">
        <canvas id="c32" style="width: 24px; height: 24px; border-radius: 4px;"></canvas>
        <span class="preview-label">32x32</span>
      </div>
    </div>
  </div>

  <script>
    const sizes = [16, 32, 48, 128];
    
    function drawIcon(canvas, size) {
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 1. Draw base rounded rect
      const radius = size * 0.22;
      ctx.fillStyle = '#0f1016';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();

      // 2. Draw gradient background circle
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#6366f1'); // Indigo
      grad.addColorStop(1, '#a855f7'); // Purple
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(size/2, size/2, size * 0.35, 0, Math.PI * 2);
      ctx.fill();

      // 3. Draw book-open path in the center
      ctx.save();
      const scale = (size * 0.42) / 24;
      const offset = (size - (24 * scale)) / 2;
      ctx.translate(offset, offset);
      ctx.scale(scale, scale);
      
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const path1 = new Path2D('M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z');
      const path2 = new Path2D('M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z');
      
      ctx.stroke(path1);
      ctx.stroke(path2);
      ctx.restore();
    }

    async function generateAndUpload() {
      const statusBadge = document.getElementById('status');
      statusBadge.textContent = 'Generating canvases...';
      
      // Draw previews
      sizes.forEach(size => {
        let canvas = document.getElementById(`c${size}`);
        if (!canvas) {
          canvas = document.createElement('canvas');
        }
        drawIcon(canvas, size);
      });

      statusBadge.textContent = 'Saving icons to extension folder...';
      
      try {
        for (const size of sizes) {
          const tempCanvas = document.createElement('canvas');
          drawIcon(tempCanvas, size);
          const dataUrl = tempCanvas.toDataURL('image/png');
          
          const response = await fetch('http://localhost:9001/api/platform/chrome/save-icons', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ size, dataUrl })
          });
          
          if (!response.ok) {
            throw new Error(`Failed to save icon${size}`);
          }
        }
        
        statusBadge.textContent = '✓ Icons saved successfully!';
        statusBadge.className = 'status-badge green';
      } catch (err) {
        console.error(err);
        statusBadge.textContent = 'Error: ' + err.message;
        statusBadge.className = 'status-badge red';
      }
    }

    // Run automatically on load
    window.addEventListener('load', () => {
      setTimeout(generateAndUpload, 500);
    });
  </script>
</body>
</html>
